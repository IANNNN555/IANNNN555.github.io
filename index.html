<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#04050a; --ink:#e9ecf5; --dim:#7c8296; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); color:var(--ink); overflow:hidden; -webkit-tap-highlight-color:transparent; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:grab; touch-action:none; user-select:none;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; }
  #stage { filter:drop-shadow(0 0 7px rgba(150,170,255,.28)); animation:breathe 5s ease-in-out infinite; }
  @keyframes breathe { 50% { filter:drop-shadow(0 0 16px rgba(150,170,255,.5)); } }
  @keyframes rise { from { opacity:0; transform:translateY(8px); letter-spacing:.16em; } to { opacity:1; transform:none; letter-spacing:.02em; } }
  body:not(.open) #title { opacity:0; }
  body.open #title { animation:rise 1.6s 2.2s cubic-bezier(.2,.7,.2,1) both; }
  #gate { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
          background:var(--bg); color:var(--ink); border:0; cursor:pointer; transition:opacity .9s; }
  #gate.gone { opacity:0; pointer-events:none; }
  #gate b { font:italic 500 clamp(28px,6vw,40px)/1.1 'Cormorant Garamond',Georgia,serif; animation:pulse 2.4s ease-in-out infinite; }
  #gate span { font:300 11px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.14em; color:var(--dim); }
  @keyframes pulse { 50% { opacity:.45; } }
  @media (prefers-reduced-motion:reduce) { #stage,body.open #title,#gate b { animation:none; } }
  #title { font:italic 500 clamp(22px,3.4vw,30px)/1.2 'Cormorant Garamond',Georgia,serif; letter-spacing:.02em; margin-top:10px; transition:opacity .35s; }
  .pill { position:fixed; top:calc(14px + env(safe-area-inset-top)); background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,.22);
          border-radius:999px; padding:8px 16px; font:italic 400 15px 'Cormorant Garamond',Georgia,serif; cursor:pointer; transition:background .2s,border-color .2s; }
  .pill:hover,.pill:focus-visible { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.5); outline:none; }
  #again { left:14px; } #wall { right:14px; }
  #music { left:14px; top:calc(58px + env(safe-area-inset-top)); }
</style>
</head>
<body>
  <button class="pill" id="again" type="button">&#8635; see me bloom again?</button>
  <button class="pill" id="wall" type="button">&#8595; wallpaper</button>
  <button class="pill" id="music" type="button">&#9835; tap for music</button>
  <audio id="bgm" src="music.mp3" loop preload="auto" autoplay playsinline></audio>
  <button id="gate" type="button"><b>tap to open</b><span>sound on &#9835;</span></button>
  <canvas id="stage"></canvas>
  <div id="title">Navy Blue</div>

<script>
const PALETTE = [
  ["Navy Blue",[40,72,255]], ["Rose Pink",[255,92,150]], ["Sunset Orange",[255,122,40]], ["Lavender Haze",[165,125,255]],
  ["Crimson Red",[235,42,62]], ["Golden Hour",[255,200,52]], ["Ocean Teal",[28,200,190]], ["Blush Peach",[255,150,132]]
];
const COLS = 90, ROWS = 60, RATIO = 1.65;          // grid size, cell height / width
const RAMP = ".:-=+*xo0%#@";
const OW = COLS * 4, OH = Math.round(ROWS * 4 * RATIO);

const stage = document.getElementById("stage"), sctx = stage.getContext("2d");
const off = document.createElement("canvas"); off.width = OW; off.height = OH;
const octx = off.getContext("2d");
const small = document.createElement("canvas"); small.width = COLS; small.height = ROWS;
const smctx = small.getContext("2d", { willReadFrequently: true });
smctx.imageSmoothingQuality = "high";

const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = v => 1 - Math.pow(1 - cl(v), 3);
const back = v => { v = cl(v); const c = 1.5; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;
const shade = (c, k) => c.map(v => Math.round(k <= 1 ? v * k : v + (255 - v) * (k - 1)));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- scene ---------- */
let scene, colorIdx = 0, cur = PALETTE[0][1].slice(), target = PALETTE[0][1].slice();

function build(seed) {
  const r = rng(seed);
  const spots = [[-.02,.37,.115],[-.17,.43,.10],[.16,.42,.10],[-.08,.52,.11],[.09,.53,.105],[-.25,.55,.075],[.25,.55,.08],[0,.62,.075],[-.14,.31,.07],[.12,.30,.07]];
  const flowers = spots.map(([x, y, rad]) => ({ x: x + (r() - .5) * .02, y: y + (r() - .5) * .02, z: (r() - .5) * .34, r: rad, rot: r() * 6.28, n: 6 + Math.floor(r() * 3) }));
  const cl8 = [[-.30,.30,.09],[.28,.27,.09],[-.38,.46,.08],[.37,.45,.08],[-.04,.19,.08],[-.22,.20,.07],[.16,.19,.07],[-.31,.60,.06],[.31,.60,.06],[.06,.10,.05]];
  const clusters = cl8.map(([x, y, rad]) => ({
    x, y, z: (r() - .5) * .44, r: rad,
    dots: Array.from({ length: 24 }, () => { const a = r() * 6.28, d = rad * Math.sqrt(r()); return { dx: Math.cos(a) * d, dy: Math.sin(a) * d, dz: (r() - .5) * rad * 1.8, s: .010 + r() * .014 }; })
  }));
  return { flowers, clusters };
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const IDLE = reduce ? 0 : .0035;     // slow turntable spin
let yaw = 0, spin = 0, parts = [], waveStart = -1e9;
function stepParts(dt, p) {
  if (reduce) return;
  if (p > .5 && parts.length < 44 && Math.random() < dt * .008) {
    const petal = Math.random() < .4, src = petal ? scene.flowers[(Math.random() * scene.flowers.length) | 0] : scene.clusters[(Math.random() * scene.clusters.length) | 0];
    parts.push({ x: src.x + (Math.random() - .5) * .1, y: src.y, z: src.z, vy: petal ? .00003 + Math.random() * .00002 : -(.00003 + Math.random() * .00004),
                 age: 0, life: 4500 + Math.random() * 3000, ph: Math.random() * 6.28, petal });
  }
  for (const q of parts) { q.age += dt; q.y += q.vy * dt; }
  parts = parts.filter(q => q.age < q.life);
}               // rotation around the vertical axis

function drawScene(p, t) {
  const w = OW, h = OH, X = x => w / 2 + x * h, Y = y => y * h;
  const cs = Math.cos(yaw), sn = Math.sin(yaw);
  const rot = (x, z) => [x * cs + z * sn, -x * sn + z * cs];   // z > 0 faces the viewer
  const persp = z => 1 + z * .3;
  const depth = z => cl(.62 + (z + .3) * .65, .45, 1);
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.globalAlpha = 1; octx.fillStyle = "#000"; octx.fillRect(0, 0, w, h);
  octx.lineCap = "round";

  // stems + baby's-breath branches
  const grow = ease(p / .3);
  octx.lineWidth = 3; octx.strokeStyle = "rgba(34,120,86,.75)";
  for (const f of scene.flowers) { const rx = rot(f.x, f.z)[0];
    octx.beginPath(); octx.moveTo(X(0), Y(.74)); octx.lineTo(mix(X(0), X(rx), grow), mix(Y(.74), Y(f.y), grow)); octx.stroke(); }
  octx.lineWidth = 1.4; octx.strokeStyle = "rgba(210,225,255,.4)";
  scene.clusters.forEach((c, j) => { const g = ease((p - .25 - j * .03) / .3), rx = rot(c.x, c.z)[0];
    octx.beginPath(); octx.moveTo(X(0), Y(.72)); octx.lineTo(mix(X(0), X(rx), g), mix(Y(.72), Y(c.y), g)); octx.stroke(); });

  // wrapping paper cone (stripes and bow turn with the bouquet)
  const ca = ease(p / .3);
  const g = octx.createLinearGradient(0, Y(.6), 0, Y(.97));
  g.addColorStop(0, rgba(cur, .5)); g.addColorStop(1, rgba(cur, .1));
  octx.globalAlpha = ca; octx.fillStyle = g;
  octx.beginPath(); octx.moveTo(X(0), Y(.97)); octx.lineTo(X(-.3), Y(.6)); octx.lineTo(X(.3), Y(.6)); octx.closePath(); octx.fill();
  octx.lineWidth = 1.5;
  for (let k = 0; k < 14; k++) {
    const ang = k / 14 * 6.283 + yaw, sx = Math.sin(ang), fr = Math.cos(ang);
    octx.globalAlpha = ca * (.12 + .42 * Math.max(0, fr)); octx.strokeStyle = rgba(shade(cur, 1.35), 1);
    octx.beginPath(); octx.moveTo(X(.3 * sx), Y(.6)); octx.lineTo(X(.3 * sx * .06), Y(.96)); octx.stroke();
  }
  const bf = Math.cos(yaw);
  if (bf > -.3) {
    octx.globalAlpha = ca * cl(bf + .3) * .85; octx.fillStyle = rgba(shade(cur, 1.25), 1);
    const bx = .138 * Math.sin(yaw), bw = .3 + .7 * Math.abs(bf);
    for (const s of [-1, 1]) { octx.beginPath(); octx.ellipse(X(bx + s * .05 * bw), Y(.8), .06 * h * bw, .025 * h, s * -.4, 0, 6.28); octx.fill(); }
  }

  // blossoms and baby's breath, back to front
  const items = [];
  scene.clusters.forEach((c, j) => items.push({ z: rot(c.x, c.z)[1], c, j }));
  scene.flowers.forEach((f, i) => items.push({ z: rot(f.x, f.z)[1], f, i }));
  items.sort((a, b) => a.z - b.z);
  for (const it of items) {
    octx.globalAlpha = depth(it.z);
    if (it.c) {
      const c = it.c, q = ease((p - .35 - it.j * .04) / .3); if (q <= 0) continue;
      const sw = Math.sin(t / 1200 + it.j) * .004;
      octx.fillStyle = "rgba(235,242,255,.95)";
      for (const d of c.dots) { const [rx, rz] = rot(c.x + d.dx * q, c.z + d.dz * q);
        octx.beginPath(); octx.arc(X(rx + sw), Y(c.y + d.dy * q), d.s * h * q * persp(rz), 0, 6.28); octx.fill(); }
    } else {
      const f = it.f, i = it.i, q = back((p - .08 - i * .05) / .5); if (q <= 0) continue;
      const [rx, rz] = rot(f.x, f.z), br = 1 + .035 * Math.sin(t / 800 + i * 1.7);
      const x = X(rx + Math.sin(t / 1100 + i) * .004), y = Y(f.y + Math.cos(t / 1300 + i) * .003), R = f.r * h * q * persp(rz) * br;
      for (let layer = 0; layer < 3; layer++) {
        const ql = cl((q - layer * .14) / .72, 0, 1.12), pr = R * (1 - layer * .28); if (ql <= 0) continue;
        octx.fillStyle = rgba(shade(cur, [.55, .85, 1.15][layer]), 1);
        for (let k = 0; k < f.n; k++) {
          const a = f.rot + k / f.n * 6.283 + layer * .4 + (1 - ql) * 1.8 + yaw * .6;
          octx.beginPath(); octx.ellipse(x + Math.cos(a) * pr * .55 * ql, y + Math.sin(a) * pr * .55 * ql, pr * .55 * (.3 + .7 * ql), pr * .32 * (.5 + .5 * ql), a, 0, 6.283); octx.fill();
        }
      }
      octx.fillStyle = rgba(shade(cur, 1.6), 1); octx.beginPath(); octx.arc(x, y, R * .14, 0, 6.283); octx.fill();
    }
  }
  for (const pt of parts) {
    const [rx, rz] = rot(pt.x, pt.z), fade = Math.sin(Math.PI * pt.age / pt.life);
    octx.globalAlpha = fade * depth(rz) * .9;
    const px = X(rx + Math.sin(pt.age / 600 + pt.ph) * .02), py = Y(pt.y);
    if (pt.petal) { octx.fillStyle = rgba(shade(cur, 1.15), 1); octx.beginPath(); octx.ellipse(px, py, .02 * h, .009 * h, pt.age / 500 + pt.ph, 0, 6.283); octx.fill(); }
    else { octx.fillStyle = "#fff"; octx.beginPath(); octx.arc(px, py, .006 * h * (.7 + .5 * Math.sin(pt.age / 150 + pt.ph)), 0, 6.283); octx.fill(); }
  }
  octx.globalAlpha = 1;

  smctx.clearRect(0, 0, COLS, ROWS); smctx.drawImage(off, 0, 0, COLS, ROWS);
  return smctx.getImageData(0, 0, COLS, ROWS).data;
}

/* ---------- ascii painter ---------- */
function paint(ctx, data, ox, oy, cw, t, glow, fx = { wave: -1, jit: 0 }) {
  const ch = cw * RATIO, fs = cw / .6;
  ctx.font = `400 ${fs}px 'JetBrains Mono', Menlo, Consolas, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const tick = Math.floor(t / 320);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const i = (y * COLS + x) * 4, r = data[i], g = data[i + 1], b = data[i + 2];
    const v = Math.max(r, g, b) / 255; if (v < .07) continue;
    let k = Math.round(Math.pow(cl(v * 1.1), .85) * (RAMP.length - 1));
    if (((((x * 73856093) ^ (y * 19349663) ^ (tick * 83492791)) >>> 0) % (fx.jit > .02 ? 3 : 9)) === 0) k = cl(k + (tick + x) % 2 * 2 - 1, 0, RAMP.length - 1);
    let boost = 0;
    if (fx.wave >= 0) { const nx = (x - COLS / 2) / (COLS / 2), ny = (y - ROWS / 2) / (ROWS / 2), d = Math.hypot(nx, ny) - fx.wave * 1.6; boost = Math.exp(-d * d / .02); if (boost > .5) k = Math.min(RAMP.length - 1, k + 2); }
    const m = (Math.min(1.35, .5 / v + .15)) * (1 + .9 * boost), col = `rgb(${Math.min(255, r * m)|0},${Math.min(255, g * m)|0},${Math.min(255, b * m)|0})`;
    ctx.fillStyle = col;
    if (glow && v > .5) { ctx.shadowColor = col; ctx.shadowBlur = cw * 1.2; } else ctx.shadowBlur = 0;
    ctx.fillText(RAMP[k], ox + (x + .5) * cw, oy + (y + .5) * ch);
  }
  ctx.shadowBlur = 0;
}

/* ---------- layout + loop ---------- */
let cw = 6, start = performance.now(), lastT = performance.now();
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const availW = innerWidth * .96, availH = innerHeight - 130;
  cw = Math.max(3, Math.min(availW / COLS, availH / (ROWS * RATIO), 9));
  stage.style.width = COLS * cw + "px"; stage.style.height = ROWS * cw * RATIO + "px";
  stage.width = Math.round(COLS * cw * dpr); stage.height = Math.round(ROWS * cw * RATIO * dpr);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);

function frame(now) {
  const dt = Math.min(50, now - lastT); lastT = now;
  if (!down) { yaw += spin + IDLE; spin *= .94; if (Math.abs(spin) < .0004) spin = 0; }
  for (let i = 0; i < 3; i++) cur[i] += (target[i] - cur[i]) * .08;
  const p = cl((now - start) / 5200); stepParts(dt, p);
  const wv = (now - waveStart) / 1100, data = drawScene(p, now);
  sctx.clearRect(0, 0, stage.width, stage.height);
  paint(sctx, data, 0, 0, cw, now, false, { wave: wv < 1 ? wv : -1, jit: 1 - p });
  requestAnimationFrame(frame);
}

function bloomAgain() { scene = build((Math.random() * 1e9) | 0); parts = []; start = performance.now(); }

/* ---------- interactions ---------- */
const titleEl = document.getElementById("title");
let down = null, moved = false, lastX = 0;
function changeColor() {
  waveStart = performance.now();
  colorIdx = (colorIdx + 1) % PALETTE.length; target = PALETTE[colorIdx][1].slice();
  titleEl.style.opacity = 0; setTimeout(() => { titleEl.textContent = PALETTE[colorIdx][0]; titleEl.style.opacity = 1; }, 220);
}
document.addEventListener("pointerdown", e => {
  if (e.target.closest(".pill")) return;
  down = { x: e.clientX }; lastX = e.clientX; moved = false; spin = 0; document.body.style.cursor = "grabbing";
});
document.addEventListener("pointermove", e => {
  if (!down) return;
  const dx = e.clientX - lastX; lastX = e.clientX;
  if (Math.abs(e.clientX - down.x) > 6) moved = true;
  if (moved) { yaw += dx * .012; spin = dx * .012; }
});
document.addEventListener("pointerup", () => { if (!down) return; if (!moved) changeColor(); down = null; document.body.style.cursor = "grab"; });
document.addEventListener("pointercancel", () => { down = null; document.body.style.cursor = "grab"; });
document.getElementById("again").addEventListener("click", bloomAgain);
document.getElementById("wall").addEventListener("click", () => {
  const W = 1179, H = 2556, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"); x.fillStyle = "#04050a"; x.fillRect(0, 0, W, H);
  const d = drawScene(1, 0), wcw = W * .97 / COLS, top = H * .26;
  paint(x, d, (W - COLS * wcw) / 2, top, wcw, 0, true);
  x.textAlign = "center"; x.fillStyle = "#e9ecf5"; x.font = "italic 500 64px 'Cormorant Garamond', Georgia, serif";
  x.fillText(PALETTE[colorIdx][0], W / 2, top + ROWS * wcw * RATIO + 110);
  c.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `bouquet-${PALETTE[colorIdx][0].toLowerCase().replace(/\s+/g, "-")}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
});

/* ---------- music: plays music.mp3 from the same folder ---------- */
const bgm = document.getElementById("bgm"), musicBtn = document.getElementById("music");
let wantMusic = true, started = false, mutedAuto = false;
const label = t => { musicBtn.innerHTML = "&#9835; " + t; };

function playMusic() {
  bgm.muted = false; bgm.volume = .7;
  bgm.play().then(() => label("music on")).catch(() => { started = false; label("tap again for music"); });
}
function stopMusic() { bgm.pause(); label("music off"); }
function begin() {                                       // first tap or key press: make the sound audible
  if (started) return; started = true;
  if (mutedAuto) { mutedAuto = false; bgm.currentTime = 0; }   // song restarts from the beginning
  if (wantMusic) playMusic();
}
bgm.addEventListener("error", () => label("music.mp3 not found"));
musicBtn.addEventListener("click", () => {
  if (!started) { wantMusic = true; begin(); return; }
  wantMusic = !wantMusic; wantMusic ? playMusic() : stopMusic();
});
for (const ev of ["pointerup", "touchend", "keydown"])   // browsers only allow sound after a tap or key press
  document.addEventListener(ev, e => { if (!(e.target.closest && e.target.closest(".pill"))) begin(); });
document.addEventListener("visibilitychange", () => {
  if (!started || !wantMusic) return;
  document.hidden ? bgm.pause() : bgm.play().catch(() => {});
});

/* try to play immediately; if the browser blocks sound, run silently and unmute on the first tap */
bgm.volume = .7;
const first = bgm.play();
if (first) first.then(() => { started = true; label("music on"); })
                .catch(() => { bgm.muted = true; mutedAuto = true; bgm.play().catch(() => {}); });

/* ---------- opening screen: one tap starts the song and the bloom together ---------- */
const gate = document.getElementById("gate"), titleNode = document.getElementById("title");
titleNode.addEventListener("animationend", () => { titleNode.style.animation = "none"; titleNode.style.opacity = 1; });
function openGate() {
  if (gate.classList.contains("gone")) return;
  gate.classList.add("gone"); document.body.classList.add("open"); setTimeout(() => gate.remove(), 1000);
  begin(); start = performance.now(); parts = [];
}
gate.addEventListener("pointerdown", e => e.stopPropagation());
gate.addEventListener("click", openGate);
if (first) first.then(openGate, () => {});            // if the browser allows sound, skip the opening screen

scene = build(7);
resize();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { start = performance.now(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
